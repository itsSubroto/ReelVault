server:
  port: 8080

spring:
  application:
    name: reelvault-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reelvault}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:divya}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

reelvault:
  jwt:
    secret: ${JWT_SECRET:reelvault-secure-jwt-secret-key-32-chars-minimum!}
  instagram:
    access-token: ${INSTAGRAM_ACCESS_TOKEN:}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  admin:
    secret: ${ADMIN_API_SECRET:reelvault-admin-secret}
